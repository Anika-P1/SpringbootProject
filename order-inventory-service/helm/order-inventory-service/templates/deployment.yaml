apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-inventory-service
  labels:
    app: order-inventory-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-inventory-service
  template:
    metadata:
      labels:
        app: order-inventory-service
    spec:
      containers:
        - name: order-inventory-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DATABASE_URL
              value: "{{ .Values.database.url }}"
            - name: DATABASE_USERNAME
              value: "{{ .Values.database.username }}"
            - name: DATABASE_PASSWORD
              value: "{{ .Values.database.password }}"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
      imagePullSecrets:
        - name: regcred