spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_inventory_db
    username: your_db_username
    password: your_db_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    com.example.orderinventory: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      enabled: true

spring:
  security:
    user:
      name: admin
      password: admin_password

# Add any additional production-specific configurations below
# e.g., cache settings, message broker configurations, etc.